version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_VARIANT=unified
      - PATHWAY_REST_CONNECTOR_HOST=0.0.0.0
      - PATHWAY_REST_CONNECTOR_PORT=8080
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    command: python src/main.py --mode unified
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_schema"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
