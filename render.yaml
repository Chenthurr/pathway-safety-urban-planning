services:
  - type: web
    name: pathway-safety-urban-planning
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_schema
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_VARIANT
        value: unified
      - key: ENABLE_RAG
        value: "true"

  - type: web
    name: city-ops-dashboard
    runtime: static
    staticPublishPath: ./frontend
    buildCommand: ""
    envVars: []
