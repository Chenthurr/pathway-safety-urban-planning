services:
  - type: web
    name: city-ops-backend
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_schema
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_VARIANT
        value: unified
      - key: ENABLE_RAG
        value: "false"
