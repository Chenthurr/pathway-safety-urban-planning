# Unified City Operations App
# Pathway LLM App style master config

$llm_model: "gpt-4o-mini"
$embedding_model: "text-embedding-3-small"

$llm: null
$embedder: null

# All Data Sources
sources:
  safety_alerts:
    type: csv_stream
    path: "./data/safety_feeds/alerts.csv"
    schema: SafetyAlertSchema
    mode: streaming
    refresh_interval: 2

  iot_sensors:
    type: csv_stream
    path: "./data/safety_feeds/iot_sensors.csv"
    schema: IoTReadingSchema
    mode: streaming
    refresh_interval: 2

  traffic:
    type: csv_stream
    path: "./data/city_data/traffic.csv"
    schema: TrafficSchema
    mode: streaming
    refresh_interval: 5

  transit:
    type: csv_stream
    path: "./data/city_data/transit.csv"
    schema: TransitSchema
    mode: streaming
    refresh_interval: 5

  environment:
    type: csv_stream
    path: "./data/city_data/environment.csv"
    schema: EnvironmentSchema
    mode: streaming
    refresh_interval: 10

# Anomaly Detection
anomaly_rules:
  - name: high_temperature
    field: temperature_c
    condition: "> 80"
    severity: critical
  - name: crowd_density
    field: crowd_count
    condition: "> 500"
    severity: warning
  - name: noise_level
    field: decibel
    condition: "> 90"
    severity: warning

# Document Store for Unified RAG
document_store:
  parser: UnstructuredParser
  splitter: TokenCountSplitter
  max_tokens: 400
  index:
    type: hybrid
    vector_index: usearch
    text_index: tantivy

# REST API Server
server:
  host: "0.0.0.0"
  port: 8080
  with_schema_endpoint: true
  with_cors: true
