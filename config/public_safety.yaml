$llm_model: "gpt-4o-mini"
$embedding_model: "text-embedding-3-small"
sources:
  safety_alerts:
    path: "./data/safety_feeds/alerts.csv"
  iot_sensors:
    path: "./data/safety_feeds/iot_sensors.csv"
anomaly_rules:
  - {name: high_temperature, field: temperature_c, condition: "> 80", severity: critical}
  - {name: crowd_density, field: crowd_count, condition: "> 500", severity: warning}
  - {name: noise_level, field: decibel, condition: "> 90", severity: warning}
server:
  host: "0.0.0.0"
  port: 8080
